[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptionpricing"
version = "0.1.0"
description = "Object-oriented option pricing: Black-Scholes now, trees, Monte Carlo, and exotics next."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyoptionpricing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pyoptionpricing"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
