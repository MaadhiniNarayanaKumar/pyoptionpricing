[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptionpricing"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "pydantic"]
dev = ["fastapi", "uvicorn", "pydantic", "httpx", "pytest", "pytest-cov"]

[tool.setuptools]
packages = ["pyoptionpricing"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
