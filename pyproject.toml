[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptionpricing"
version = "0.1.0"
requires-python = ">=3.9"
# Runtime dependencies for the library and the FastAPI backend. Vercel installs
# from this list (it prefers pyproject.toml over requirements.txt), so every
# package the deployed API imports must be here.
dependencies = ["numpy", "scipy", "fastapi", "pydantic"]

[project.optional-dependencies]
dev = ["uvicorn", "httpx", "pytest", "pytest-cov"]

[tool.setuptools]
packages = ["pyoptionpricing"]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
